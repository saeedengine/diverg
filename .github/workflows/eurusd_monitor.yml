name: EUR/USD RSI Divergence Monitor

on:
  # Primary trigger: an external pinger (e.g. cron-job.org) calling the
  # GitHub API to fire workflow_dispatch every 15 minutes is the most
  # reliable way to run this on time. Optional for now — without it, this
  # still runs via the hourly fallback below, just less promptly.
  workflow_dispatch: {}
  schedule:
    - cron: '22 * * * *'   # hourly safety net, offset from the BTC job

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run divergence check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python eurusd_divergence_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eurusd_state.json
          git diff --staged --quiet || git commit -m "Update EUR/USD state"
          git push
