name: BTC RSI Divergence Monitor

on:
  # Primary trigger: an external pinger (e.g. cron-job.org) calls the
  # GitHub API every 5 minutes to fire workflow_dispatch, because GitHub's
  # own `schedule:` queue is best-effort and drifts badly at 5-minute
  # frequency. See README "Fixing the 5-minute timing" section.
  workflow_dispatch: {}
  # Safety net only: catches the (rare) case where the external pinger is
  # itself down. Not the primary cadence.
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run divergence check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc_divergence_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state"
          git push
